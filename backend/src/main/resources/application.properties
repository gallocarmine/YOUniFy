spring.application.name=YOUniFy

# DB Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
#change in production with false (no log SQL)
spring.jpa.show-sql=true

# fetch limit for RAM consuming
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# change based on number of scheduled service
spring.task.scheduling.pool.size=2

# Flyway Settings
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1
#spring.flyway.clean-disabled=true


# MinIO Configuration
minio.url=${MINIO_URL}
minio.access-key=${MINIO_USER}
minio.secret-key=${MINIO_PASS}
minio.bucket-name=${MINIO_BUCKET_NAME}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Admin Setting
application.security.admin.password=${ADMIN_PASS}

# Token (JWT) Settings
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# 2FA Settings
application.security.2fa.expiration=${TWO_FACTOR_EXPIRATION}



# EmailProvider (SMTP) Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# in prod switch with a workspace email (or similar service)
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenApi PEC
integration.openapi.base-url=${OPENAPI_TEST}
integration.openapi.token=${OPENAPI_TOKEN_TEST}

# Censorship Service
app.censorship.bad-words=${CENSORSHIP_WORDS}


# in prod change  with (eg. "https://www.younify.it")
app.cors.allowed-origins=${ORIGINS_ACCEPTED}

# HTTPs activation
# in prod set on false
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit

# in prod change with provider cloud port (usually 8080)
server.address=0.0.0.0
server.port=8443
# for prod insert server.forward-headers-strategy=native